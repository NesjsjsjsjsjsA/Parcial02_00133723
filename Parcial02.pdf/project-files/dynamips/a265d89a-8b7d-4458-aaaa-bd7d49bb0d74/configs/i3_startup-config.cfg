!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.35.29.113 255.255.255.248
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 10.35.29.125 255.255.255.252
 duplex auto
 speed auto
!
ip forward-protocol nd
ip route 10.25.29.96 255.255.255.240 10.35.29.126
ip route 10.35.29.0 255.255.255.192 10.25.29.125
ip route 10.35.29.0 255.255.255.192 10.35.29.126
ip route 10.35.29.64 255.255.255.224 10.35.29.126
ip route 10.35.29.120 255.255.255.252 10.35.29.126
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
